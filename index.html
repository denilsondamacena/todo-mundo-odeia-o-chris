<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha a Versão</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/oO2db5L.png">
    
    <style>
        :root {
            --bg-principal: #ffd42d;
            --detalhe-limao: #ccff31;
            --azul: #3437f7;
            --azul-hover: #2225c5;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.7);
            --shadow-lg: 0 20px 25px -5px rgba(52, 55, 247, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            background-color: var(--bg-principal);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(204, 255, 49, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(52, 55, 247, 0.2) 0%, transparent 50%);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        .selection-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(110%);
            -webkit-backdrop-filter: blur(16px) saturate(110%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .logo-header {
            width: 90px;
            height: auto;
            margin-bottom: 16px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .selection-panel h1 {
            color: var(--azul);
            font-size: 20px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .selection-panel p {
            font-size: 15px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .version-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-version {
            background: var(--azul);
            color: #ffffff;
            font-weight: 700;
            padding: 16px 24px;
            border-radius: 100px;
            text-decoration: none;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px rgba(52, 55, 247, 0.3);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-version:hover {
            background: var(--azul-hover);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(52, 55, 247, 0.4);
        }

        .btn-version.secondary {
            background: rgba(255, 255, 255, 0.8);
            color: var(--azul);
            border: 2px solid var(--azul);
            box-shadow: none;
        }

        .btn-version.secondary:hover {
            background: #ffffff;
            color: var(--azul-hover);
        }

        .footer-credits {
            margin-top: 25px;
            font-size: 13px;
            color: #444;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <main class="selection-panel">
        <img src="https://i.imgur.com/oO2db5L.png" alt="Logo" class="logo-header" style="width: 200px;">
        <h1>Site Todo Mundo Odeia o Chris - Evolution Lab</h1>
        <p>Selecione a versão do site que você deseja navegar:</p>

        <div class="version-links">
            <a href="./todo_mundo_odeia_o_chris_v1/" class="btn-version" style="white-space: nowrap;">
                Acessar versão 1 (2024)
            </a>
            <a href="./todo_mundo_odeia_o_chris_v2/html-version/" class="btn-version secondary" style="white-space: nowrap;">
                Acessar versão 2 (2026)
            </a>
        </div>

        <div class="footer-credits">
            Denilson Silva Damacena
        </div>
    </main>

</body>
</html>
